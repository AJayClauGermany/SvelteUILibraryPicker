name: Data correction
description: Something about a library is wrong or out of date.
labels: [data]
body:
  - type: input
    id: library
    attributes:
      label: Library
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What's wrong?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source that shows the correct information
      description: Official docs page, repo file, npm, changelog…
    validations:
      required: true
