name: Data health

# Weekly check of the data against the outside world: newer npm releases, Svelte peer ranges,
# broken docs links, stale entries and preview gaps. It changes no files: it keeps one open issue
# labelled "data-health" up to date with the findings, for a human (or an agent) to work through.
# See docs/maintaining.md for what each finding means and how to act on it.

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: data-health
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore link-check cache
        # Good links are re-checked after 7 days anyway; the cache only spares hosts in between.
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/ulp-links.json
          key: ulp-links-${{ github.run_id }}
          restore-keys: ulp-links-
      - name: Build the report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "_Generated by the [Data health workflow](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) on $(date -u +%F). Run the same commands locally: \`pnpm status\`, \`pnpm check:updates\`, \`pnpm check:links\`. See docs/maintaining.md._"
            echo
            pnpm --silent check:updates --markdown
            pnpm --silent check:links --markdown || true
            pnpm --silent status --markdown
            echo
            echo "## Issue triage"
            echo
            echo "Open issues waiting for triage (no \`pr-allowed\` label): [search](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/issues?q=is%3Aissue+is%3Aopen+-label%3Apr-allowed+-label%3Adata-health). Label the ones ready for a PR, split or close the rest (docs/maintaining.md)."
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Update the data-health issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Issue bodies are limited to 65536 characters.
          if [ "$(wc -c < report.md)" -gt 60000 ]; then
            head -c 60000 report.md > body.md
            printf '\n\n_Truncated: see the workflow run summary for the full report._\n' >> body.md
          else
            cp report.md body.md
          fi
          # Labels the contribution process relies on (docs/maintaining.md). --force keeps them in step.
          gh label create data-health --color 0E8A16 --description "Weekly data health report" --force
          gh label create pr-allowed --color 1D76DB --description "Triaged: a PR for this issue is welcome" --force
          gh label create "good first issue" --color 7057FF --description "Small and well defined; good for a first PR" --force
          gh label create "help wanted" --color 008672 --description "Ready for a contributor to pick up" --force
          gh label create site --color C5DEF5 --description "Site bug or improvement" --force
          number=$(gh issue list --label data-health --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file body.md
          else
            gh issue create --title "Data health report" --label data-health --body-file body.md
          fi
