name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore highlighted preview code
        # Cache of the twoslash-highlighted preview sources (see previewCode() in vite.config.ts).
        # Entries are keyed by content, so restoring an older cache is safe; only changed
        # previews are highlighted again, and the build removes entries it didn't use.
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/svp-code
          key: svp-code-${{ hashFiles('pnpm-lock.yaml', 'patches/**') }}-${{ hashFiles('previews/src/**') }}
          restore-keys: svp-code-${{ hashFiles('pnpm-lock.yaml', 'patches/**') }}-
      - name: Validate data (docs links, licenses, AI policy)
        run: pnpm validate
      - name: Project status (job summary)
        # Offline overview: counts, preview coverage, stale entries, version pins. See docs/maintaining.md.
        run: pnpm --silent status --markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Type check
        run: pnpm check
      - name: Build
        run: pnpm build
