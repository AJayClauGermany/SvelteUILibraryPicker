name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a production deploy that is in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      - name: Restore highlighted preview code
        # Cache of the twoslash-highlighted preview sources (see previewCode() in vite.config.ts).
        # Entries are keyed by content, so restoring an older cache is safe; only changed
        # previews are highlighted again, and the build removes entries it didn't use.
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/svp-code
          key: svp-code-${{ hashFiles('pnpm-lock.yaml', 'patches/**') }}-${{ hashFiles('previews/src/**') }}
          restore-keys: svp-code-${{ hashFiles('pnpm-lock.yaml', 'patches/**') }}-
      - name: Validate data
        run: pnpm validate
      - name: Build
        run: pnpm build
        env:
          # e.g. "/SvelteUILibraryPicker" for a project site, "" for a custom domain.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
